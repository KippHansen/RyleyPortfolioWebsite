<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryley Hansen</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<script src="js/main.js"></script>

<body>
    <header class="banner" id="top">
        <h1 class="banner__name">Ryley Hansen</h1>
    </header>

    <main class="page">
        <div class="page__content">
            <section id="profiles">
                <h2>Profiles</h2>
                <div class="profiles">
                    <!--Itch.io-->
                    <a class="profile-btn" href="https://kippcharging.itch.io/" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/itch.png" alt="">
                        <img class="down" src="assets/images/itch_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Itch.io</span>
                    </a>
                    <!--GitHub-->
                    <a class="profile-btn" href="https://github.com/KippHansen" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/github.png" alt="">
                        <img class="down" src="assets/images/github_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">GitHub</span>
                    </a>
                    <!--LinkedIn-->
                    <a class="profile-btn" href="https://www.linkedin.com/in/ryley-hansen-357026315/" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/linkedin.png" alt="">
                        <img class="down" src="assets/images/linkedin_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">LinkedIn</span>
                    </a>
                </div>
            </section>
            
            <section id="doan_digital">
                <h2>Doan Digital</h2>
                <div class="profiles">
                    <!--Doan Digital Website-->
                    <a class="profile-btn" href="https://doandigital.net/" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/doan_website.png" alt="">
                        <img class="down" src="assets/images/doan_website_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Doan Digital</span>
                    </a>
                    <!--Doan Digital Game Jam-->
                    <a class="profile-btn" href="https://itch.io/jam/doandigital" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/dd_game_jam.jpg" alt="">
                        <img class="down" src="assets/images/dd_game_jam.jpg" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Game Jam</span>
                    </a>
                    <!--Doan Digital Discord-->
                    <a class="profile-btn" href="https://discord.gg/kHSCMFKur" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/discord.png" alt="">
                        <img class="down" src="assets/images/discord_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Discord</span>
                    </a>
                </div>
                
                <h3>Games</h3>
                <div class="carousel">
                <button type="button" class="carousel__arrow carousel__arrow--prev" aria-label="Previous games">&#9664;</button>

                <ul class="carousel__track">
                    <li class="game-card">
                    <a href="https://yourname.itch.io/game-one" target="_blank" rel="noopener">
                        <img src="assets/images/games/game-one.jpg" alt="Game One cover art">
                        <span class="game-card__title">Game One</span>
                        <span class="game-card__store">itch.io</span>
                    </a>
                    </li>

                    <li class="game-card">
                    <a href="https://store.steampowered.com/app/000000" target="_blank" rel="noopener">
                        <img src="assets/images/games/game-two.jpg" alt="Game Two cover art">
                        <span class="game-card__title">Game Two</span>
                        <span class="game-card__store">Steam</span>
                    </a>
                    </li>

                    <!-- copy a whole <li> block for each additional game -->
                </ul>

                <button type="button" class="carousel__arrow carousel__arrow--next" aria-label="Next games">&#9654;</button>
                </div>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <div class="profiles">
                    <!--Animal Thief-->
                    <a class="profile-btn" href="https://eyan11.itch.io/animal-thief" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/animal_thief.PNG" alt="">
                        <img class="down" src="assets/images/animal_thief.PNG" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Animal Thief</span>
                    </a>
                    <!--Scaledom-->
                    <a class="profile-btn" href="https://kippcharging.itch.io/scaledom" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/scaledom.PNG" alt="">
                        <img class="down" src="assets/images/scaledom.PNG" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Scaledom</span>
                    </a>
                    <!--YouTube-->
                    <a class="profile-btn" href="https://www.youtube.com/@RhyMusicc" target="_blank" rel="noopener">
                        <img class="up" src="assets/images/youtube.png" alt="">
                        <img class="down" src="assets/images/youtube_pressed.png" alt="" aria-hidden="true">
                        <span class="profile-btn__label">Music Channel</span>
                    </a>
                </div>
            </section>
        </div>
        <footer class="mini-banner">
            <a href="mailto:first@example.com">ryleythansen@gmail.com</a>
            <a href="mailto:second@example.com">ryley@doandigital.net</a>
        </footer>
    </main>
</body>
</html>
