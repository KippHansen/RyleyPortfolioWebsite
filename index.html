<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryley Hansen</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <header class="banner" id="top">
        <h1 class="banner__name">Ryley Hansen</h1>
    </header>

    <nav class="nav" aria-label="Main">
        <a href="#profiles">Profiles</a>
        <a href="doan_digital">Doan Digital</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="page">
        <div class="page__content">
            <section id="profiles">
                <h2>Profiles</h2>
                <div class="profiles">
                    <!--Itch.io-->
                    <a class="profile-btn" href="https://kippcharging.itch.io/" target="_blank" rel="noopener" aria-label="itch.io profile">
                        <img class="up" src="assets/images/itch.png" alt="itch.io">
                        <img class="down" src="assets/images/itch_pressed.png" alt="" aria-hidden="true">
                    </a>
                    <!--GitHub-->
                    <a class="profile-btn" href="https://github.com/KippHansen" target="_blank" rel="noopener" aria-label="GitHub profile">
                        <img class="up" src="assets/images/github.png" alt="GitHub">
                        <img class="down" src="assets/images/github_pressed.png" alt="" aria-hidden="true">
                    </a>
                    <!--LinkedIn-->
                    <a class="profile-btn" href="https://www.linkedin.com/in/ryley-hansen-357026315/" target="_blank" rel="noopener" aria-label="LinkedIn profile">
                        <img class="up" src="assets/images/linkedin.png" alt="GitHub">
                        <img class="down" src="assets/images/linkedin_pressed.png" alt="" aria-hidden="true">
                    </a>
                </div>
            </section>
            
            <section id="startup">
                <h2>My Startup</h2>
                <div class="profiles">
                    <!--Doan Digital Website-->
                    <a class="profile-btn" href="https://doandigital.net/" target="_blank" rel="noopener" aria-label="Startup website">
                        <img class="up" src="assets/images/dd_logo_full.png" alt="Startup name">
                    </a>

                </div>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <p>Your projects go here.</p>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p>Email, GitHub, LinkedIn.</p>
            </section>
        </div>
    </main>
</body>
</html>
