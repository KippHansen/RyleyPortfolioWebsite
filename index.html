<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ryley Hansen</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <header class="banner" id="top">
        <h1 class="banner__name">Ryley Hansen</h1>
    </header>

    <nav class="nav" aria-label="Main">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="page">
        <div class="page__content">
            <section id="profiles">
                <h2>Profiles</h2>
                <div class="profiles">
                    <a class="profile-btn" href="https://yourname.itch.io" target="_blank" rel="noopener" aria-label="itch.io profile">
                        <img src="assets/images/itchio.png" alt="itch.io">
                    </a>
                    <a class="profile-btn" href="https://github.com/yourusername" target="_blank" rel="noopener" aria-label="GitHub profile">
                        <img src="assets/images/github.png" alt="GitHub">
                    </a>
                    <a class="profile-btn" href="https://www.linkedin.com/in/yourusername" target="_blank" rel="noopener" aria-label="LinkedIn profile">
                        <img src="assets/images/linkedin.png" alt="LinkedIn">
                    </a>
                </div>
            </section>

            <section id="projects">
                <h2>Projects</h2>
                <p>Your projects go here.</p>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p>Email, GitHub, LinkedIn.</p>
            </section>
        </div>
    </main>
</body>
</html>
